<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harness AI | Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">harness<span>.</span></div>
            <div class="nav-label">MAIN MENU</div>
            <nav aria-label="Main navigation">
                <a class="nav-item active" href="index.html" aria-current="page">
                    <span class="nav-icon">⌂</span>Home
                </a>
                <a class="nav-item" href="pages/agents.html">
                    <span class="nav-icon">◈</span>Agents
                </a>
                <a class="nav-item" href="pages/workflows.html">
                    <span class="nav-icon">⇄</span>Workflows
                </a>
                <a class="nav-item" href="pages/analytics.html">
                    <span class="nav-icon">▥</span>Analytics
                </a>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="breadcrumb">Workspace / Home</div>
                <div class="profile-small">
                    <div class="avatar" id="smallAvatar">U</div>
                    <span id="topName">User</span>
                </div>
            </header>

            <section class="section active" id="home">
                

                

                

                <!-- CHAT BAR -->
                <div class="card chat-card">
                    <div class="chat-heading">
                        <div class="panel-title">Start a conversation</div>
                        <span class="chat-status">● AI WORKSPACE</span>
                    </div>

                    <textarea
                        id="chatInput"
                        class="chat-input"
                        placeholder="Ask Harness AI anything... Describe your task, goal, or problem."
                    ></textarea>

                    <div class="chat-footer">
                        <span class="hint"></span>
                        <button class="primary-btn" id="sendBtn" onclick="submitTask()">
                            Start execution →
                        </button>
                    </div>
                </div>

                <div class="response-box">
                    <div class="response-header">
                        <span class="response-title">Output</span>
                        <button class="copy-btn" id="copyBtn" onclick="copyResponse()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                    </div>
                    <div id="output" class="response-content">Response will appear here...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
